name: GEOIZ 1.1.0 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract GEOIZ 1.1.0 project
        shell: bash
        run: |
          set -e

          ZIP_FILE="./GEOIZ-1.1.0-FULL-PLATFORM.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "GEOIZ 1.1.0 ZIP dosyası bulunamadı."
            exit 1
          fi

          mkdir -p build-source
          unzip -q "$ZIP_FILE" -d build-source

          PROJECT_DIR=$(find build-source -type f -name "settings.gradle" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android proje klasörü bulunamadı."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "GEOIZ 1.1.0 projesi: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build GEOIZ 1.1.0 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload GEOIZ 1.1.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: GEOIZ-1.1.0-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
